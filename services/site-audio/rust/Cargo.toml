[package]
name = "ocv-site-receipt"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Independent bounded WAV and Standard MIDI File byte receipt"

[[bin]]
name = "receipt"
path = "old.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
opt-level = 2
lto = false
panic = "abort"
codegen-units = 1
strip = true

[workspace]
