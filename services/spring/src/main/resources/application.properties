server.port=8081
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=32
server.tomcat.max-http-form-post-size=16384
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=2000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=ocv_jpa
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.data.redis.timeout=1500ms
spring.data.redis.connect-timeout=1000ms
spring.data.redis.lettuce.pool.max-active=2
logging.file.name=/ocv-data/spring.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=2
logging.pattern.console=%d{yyyy/MM/dd HH:mm} Spring的锅 %msg%n
