[package]
name = "slot7"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Bounded two-dimensional workshop execution and replay core"

[lib]
path = "cache.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ocv-mechanics"
path = "1.rs"

[dependencies]
rapier2d = { version = "=0.22.0", features = ["enhanced-determinism"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
opt-level = 2
lto = true
panic = "abort"
codegen-units = 1
strip = true

[workspace]
