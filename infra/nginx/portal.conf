server {
  listen 4321;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  error_page 404 /404.html;
  error_page 500 /500.html;
  location = /500/ { return 500; }
  location ~ \.mjs$ { types { application/javascript mjs; } try_files $uri =404; }
  location / { try_files $uri $uri/ =404; }
}
