worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  server_tokens off;
  client_max_body_size 16k;
  proxy_connect_timeout 2s;
  proxy_read_timeout 8s;
  proxy_send_timeout 5s;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Docker's embedded resolver follows service addresses after recreation.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  upstream ocv_next { zone ocv_next 64k; server next:3200 resolve; }
  upstream ocv_gateway { zone ocv_gateway 64k; server gateway:3000 resolve; }
  upstream ocv_portal { zone ocv_portal 64k; server portal:4321 resolve; }
  server {
    listen 8080;
    location /borrowed { proxy_http_version 1.1; proxy_pass http://ocv_next; }
    location /_next/ { proxy_http_version 1.1; proxy_pass http://ocv_next; }
    location /next-api/ { proxy_http_version 1.1; proxy_pass http://ocv_next; }
    location /api/ { proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_pass http://ocv_gateway; }
    location /health/ { proxy_pass http://ocv_gateway; }
    location / { proxy_redirect ~^http://[^/]+:4321(/.*)$ $scheme://$http_host$1; proxy_pass http://ocv_portal; }
  }
}
